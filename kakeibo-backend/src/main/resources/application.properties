spring.application.name=kakeibo-backend

# --------------------------------------------------
# MySQL 接続設定
# --------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/kakeibo_db?serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# JPA / Hibernate 設定
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Hibernateのテーブル自動生成後に data.sql を実行させる設定
spring.jpa.defer-datasource-initialization=true
# データ投入設定の有効化
spring.sql.init.mode=never

server.port=8081